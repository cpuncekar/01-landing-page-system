<!DOCTYPE html>
<html lang="en">
<head>

  <title>Landing Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAV -->
  <header class="nav">

    <button id="ctaTop" class="btn">Get Started</button>

  <!-- FEATURES -->

    <div class="card">
      <h3>Fast</h3>
      <p>Lightweight and quick to load.</p>
    </div>
    <div class="card">
      <h3>Modern</h3>
      <p>Clean UI with simple structure.</p>
    </div>
    <div class="card">
      <h3>Responsive</h3>
      <p>Works on desktop and mobile.</p>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 YourBrand</p>
  </footer>

  <script src="script.js"></script>

</html>
